name: 🐛 Bug report
description: Something not working as expected? Let us know.
labels: [bug, pending triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        The fastest way to get a bug fixed is a **minimal reproduction**: the smallest project that shows the problem. Reports with one are looked at first. If you can't make one, describe the steps to reproduce instead.

  - type: input
    attributes:
      label: Minimal reproduction URL
      description: A [StackBlitz](https://stackblitz.com) link or a GitHub repository. Remove any code, file, or dependency that isn't needed to show the bug.
      placeholder: https://stackblitz.com/...

  - type: textarea
    attributes:
      label: What happened?
      description: What you expected, what happened instead, and any error output.
      placeholder: |
        Steps to reproduce:
        1. ...

        Expected:

        Actual:
    validations:
      required: true

  - type: input
    attributes:
      label: Version
      description: The version of this project where you see the bug.
      placeholder: v0.0.0
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Anything that might be relevant, such as your Node.js version, package manager, and operating system.
      placeholder: |
        - Node.js: v24.0.0
        - Package manager: pnpm
        - OS: macOS

  - type: checkboxes
    attributes:
      label: Contribute
      options:
        - label: I'd like to open a PR to fix this

  - type: markdown
    attributes:
      value: |
        These projects are maintained in my free time. [Sponsoring](https://github.com/sponsors/privatenumber) helps keep them going.
