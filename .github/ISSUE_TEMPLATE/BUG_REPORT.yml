name: 🐛 Bug report
description: Report a bug
labels: [bug, pending triage]
body:
  - type: markdown
    attributes:
      value: |
        💡 Even better than an issue: open a pull request with a failing test that proves the bug. It doesn't need an issue or a fix.

  - type: textarea
    attributes:
      label: Reproduction
      description: The smallest code that shows the bug. A code snippet with the command to run it, a GitHub repository, or a [StackBlitz](https://node.new) link. Include every file it needs, such as `package.json` and `tsconfig.json`.
      placeholder: |
        ```js
        // index.js
        ```

        $ node index.js
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected and actual behavior
      description: Paste errors as text, not screenshots.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Versions
      description: Exact versions of this package, Node.js, and any related tools (such as TypeScript or Vite). "latest" isn't a version.
      placeholder: |
        - Package: 1.2.3
        - Node.js: 24.11.0
        - OS: macOS 15
        - Package manager: pnpm 10.1.0
    validations:
      required: true

  - type: input
    attributes:
      label: Last working version
      description: If this is a regression, the last version without the bug.

  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: I ran the reproduction on the latest version and it shows the bug
          required: true

  - type: checkboxes
    attributes:
      label: Contribute
      options:
        - label: I'd like to open a PR with a failing test or a fix

  - type: markdown
    attributes:
      value: |
        💖 These projects are free and maintained by one person. If they help you, [sponsor](https://github.com/sponsors/privatenumber) monthly or with a one-time donation.
