name: 🐛 Bug report
description: Report a bug
labels: [bug, pending triage]
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: The smallest code that shows the bug. A code snippet with the command to run it, a GitHub repository, or a [StackBlitz](https://node.new) link.
      placeholder: |
        ```js
        // index.js
        ```

        $ node index.js
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected and actual behavior
      description: Include any error output.
    validations:
      required: true

  - type: input
    attributes:
      label: Version
      placeholder: v0.0.0
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Output of `npx envinfo --system --binaries`
      render: shell

  - type: checkboxes
    attributes:
      label: Contribute
      options:
        - label: I'd like to open a PR to fix this

  - type: markdown
    attributes:
      value: |
        💖 These projects are free and maintained by one person. If they help you, [sponsor](https://github.com/sponsors/privatenumber) monthly or with a one-time donation.
