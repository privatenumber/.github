name: 🌟 Feature request
description: Suggest an idea
labels: [enhancement, pending triage]
body:
  - type: textarea
    attributes:
      label: Feature request
      description: What would you like to be able to do?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Motivation
      description: What problem does this solve? How do you work around it today?

  - type: checkboxes
    attributes:
      label: Contribute
      options:
        - label: I'd like to open a PR for this

  - type: markdown
    attributes:
      value: |
        💖 These projects are free and maintained by one person. If they help you, [sponsor](https://github.com/sponsors/privatenumber) monthly or with a one-time donation.
