name: 🌟 Feature request
description: Have an idea for this project? Tell us about it.
labels: [enhancement, pending triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea! Requests that explain the problem behind them are the easiest to evaluate.

  - type: textarea
    attributes:
      label: Feature request
      description: What would you like to be able to do?
      placeholder: |
        I would love to be able to...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Motivation
      description: What problem does this solve? How do you handle it today?

  - type: textarea
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you've considered, plus any links or screenshots.

  - type: checkboxes
    attributes:
      label: Contribute
      options:
        - label: I'd like to open a PR for this

  - type: markdown
    attributes:
      value: |
        These projects are maintained in my free time. [Sponsoring](https://github.com/sponsors/privatenumber) helps keep them going.
