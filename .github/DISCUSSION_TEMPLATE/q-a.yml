body:
  - type: markdown
    attributes:
      value: |
        ## 💬 What's your question?

        1. **Keep it concise:** Start with the question. The shorter the text, the more reads it gets.
        2. **Write clearly:** Use a spelling & grammar checker, ChatGPT, etc.
        3. **Include context:** Attach code snippets, configurations, errors, and screenshots.
        4. **Proof-read:** Pretend you're a stranger online. Would you understand your question?

  - type: textarea
    attributes:
      label: Question
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        💖 These projects are free and maintained by one person. If they help you, [sponsor](https://github.com/sponsors/privatenumber) monthly or with a one-time donation.
